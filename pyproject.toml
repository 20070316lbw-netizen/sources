[project]
name = "sources"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edgartools>=5.56.0",
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pandas-datareader>=0.11.1",
    "yfinance>=1.7.0",
]

[project.scripts]
sources = "sources:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
