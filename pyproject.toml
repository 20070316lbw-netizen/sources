[project]
name = "sources"
version = "0.1.0"
description = "量化数据抓取包: S&P 500 成分股 / 行情 / SEC EDGAR 基本面原始数据, 只做抓取和字段级初步清洗"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edgartools>=5.56.0",
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pandas-datareader>=0.11.1",
    "requests>=2.31.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6.0",
]
